[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-policy-gateway"
version = "0.4.0"
description = "Zero-trust MCP policy gateway with identity, approvals, supply-chain protection, schema pinning, and audit"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "mcp>=2.1,<3",
  "httpx2>=2.12,<3",
]

[project.scripts]
mcp-policy-gateway = "mcp_policy_gateway.cli:main"
mcp-policy-scan = "mcp_policy_gateway.scan_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
