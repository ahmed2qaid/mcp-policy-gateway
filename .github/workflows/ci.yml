name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: mcp-policy-gateway --help
      - run: mcp-policy-scan examples/gateway.json --fail-on high
      - run: python -m unittest discover -s tests -v
